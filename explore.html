<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <style>
    body{
    margin: 0;
    padding: 0;
background-attachment: fixed;
    /* background-image: url("img/tower2.jpeg"); */
    background-repeat: no-repeat;
   background-size:cover;
background-image: url(img/tower2.jpeg);
overflow-x: hidden;
font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;}
 h1{
    margin: 0;
    padding: 4px 0;
    text-align: center;
    background-color: rgb(33, 32, 32);
    color: white;
    
 }



 ul{
    display: flex;
    justify-content: space-between;
    list-style: none;
 }

 button{
    font-size: 25px;
    /* box-shadow: 2px 2px 5px 4px yellow; */
    background-color: rgb(0, 0, 0);
    color: rgb(255, 255, 255);
    padding: 5px;
    border-radius: 30px;
    transition:background 1s linear ;
 }
button:hover{
   /* font-size: 27px; */
   scale: 1.1;
   background-color: brown;
}
 h2{
    position: absolute;
    right: 10px;
    background-color: rgb(20, 26, 2);
    padding: 7px;
    color: white;
    border-radius: 30px;
    box-shadow: 5px 5px 5px 4px rgba(93, 150, 176, 0.807);
 }

 img{
    width:45%;
    height: 300px;
    border-radius:30px ;
    position: absolute;
    right: 10px;
 top: 260px;
 box-shadow: 2px 2px 5px 4px black;
 }

 p{
    width: 45%;
    position: relative;
    top: 130px;
    left: 15px;
    background-image: linear-gradient(rgba(24, 32, 3, 0.685),rgb(48, 49, 5));
    color: white;
    border-radius: 30px;
    padding: 10px;
    font-size: 20px;
    font-family:Arial, Helvetica, sans-serif;

 }

iframe{
   width: 100%;
height: 250vh;
  
} 

span{
   font-size: 40px;
   position: relative;
   left: 15px;
   
}
.span2{
   position: relative;
   bottom: 5px;

}
a{
   text-decoration: none;
   color: black;
}


@media (max-width:720px){
   body{
      background-position: -500px;
   }
   ul{
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      translate: -15px;
      
   }

   button{
      margin-bottom: 10px;
   }


}

  </style>
</head>
<body>
   <h1>المدن السياحية</h1> 
   <header>
    <ul>
       <button onclick="press('cairo.html'); changebg('tower2.jpeg')">القاهرة</button>
        <button onclick="press('Alex.html'); changebg('castel.jpeg')">الإسكندرية</button>
        <button onclick="press('redsea.html'); changebg('beach.jpeg')" >البحر الأحمر</button>
        <button  onclick="press('Giza.html'); changebg('pyramids.jpeg')">الجيزة</button>
        <button onclick="press('fayom.html'); changebg('wonderful.jpeg')">الفيوم</button>
        <button onclick="press('Aswan.html'); changebg('temple.jpeg')">أسوان </button>
        <button  onclick="press('Aoxur.html'); changebg('axor.jpeg')">الأقصر</button>
    </ul>
  
   </header>
   <a href="index.html"><span>⬅<span class="span2" style="font-size: 20px;">الصفحة الرئيسية</span></span></a>
<br><br>
<iframe id="s"  frameborder="0"> </iframe>
