<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="4 url=main.html"> 
    <title>Document</title>
    <style>
      body{
        margin: 0;
        padding: 0;
        background-image: linear-gradient(rgb(80, 56, 12) 20%, white);
        background-repeat: no-repeat;
        background-size: cover;
        height: 100vh;
        animation-name: y;
        animation-duration: 4s;
        animation-delay: .5s;
        animation-timing-function: linear;
      }
      @keyframes y{
        from{
          opacity: 1;
        }
        to{
          opacity: 0;
        }
      }
      .parent{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .parent div{
        display: flex;
        flex-direction: column;
        align-items: center;
        animation-name: x;
        animation-duration: 7s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      @keyframes x{
        0%{
        translate: 0 -10px;
       }

       25%{
        translate: 0 10px;
       }

       50%{
        translate: 0 -10px;
       }

       75%{
        translate: 0 10px;
       }

       100%{
        translate: 0 -10px;
       }
      }
      p{
        margin: 2px;
        font-size: 24px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      img{
        width: 150px;
        height: 150px;
        border-radius: 50%;
        box-shadow: 2px 2px 20px 4px goldenrod;
      }

    </style>
</head>
<body>
    <div class="parent">
        <div>
            <img src="img/pyramids.jpeg" alt="">
            <p>مرحبا بك في موقع</p>
            <p>Explore <span style="color: red;">E</span>gyp<span style="color: black;">t</span></p>
        
        
        </div>
    </div>
</body>
</html>
